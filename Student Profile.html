<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile</title>
</head>
<body style="margin: 0; background-color: #f5f3ff; padding: 16px; font-family: Arial, sans-serif; color: #0f172a;">
  <main style="max-width: 480px; margin: 0 auto;">
    
    <!-- Header Banner -->
    <div style="background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 18px; border-radius: 16px; text-align: center;">
      <h1 style="margin: 0; font-size: 24px;">Student Profile Page</h1>
    </div>

    <!-- About Me Card -->
    <section style="background: white; padding: 16px; margin-top: 12px; border-radius: 16px; text-align: center; box-shadow: 0 3px 12px #ddd;">
      <h2 style="margin-top: 0; text-align: left; font-size: 18px;">About Me</h2>
      <img src="https://randomuser.me/api/portraits/men/85.jpg" alt="Sorry for inconvenience" width="80" height="80" style="border-radius: 50%; border: 3px solid #4f46e5;">
      <p style="margin: 8px 0 0; font-weight: bold; color: #334155;">Praveen Prakash | CSE</p>
    </section>

    <!-- My Skills Card -->
    <section style="background: white; padding: 16px; margin-top: 12px; border-radius: 16px; box-shadow: 0 3px 12px #ddd;">
      <h2 style="margin-top: 0; font-size: 18px;">My Skill</h2>
      <ul style="display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0;">
        <li style="background: #ede9fe; color: #4338ca; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 14px;">HTML</li>
        <li style="background: #ede9fe; color: #4338ca; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 14px;">Python</li>
        <li style="background: #ede9fe; color: #4338ca; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 14px;">C</li>
        <li style="background: #ede9fe; color: #4338ca; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 14px;">MySQL</li>
      </ul>
    </section>

    <!-- My Projects Card -->
    <section style="background: white; padding: 16px; margin-top: 12px; border-radius: 16px; border-left: 4px solid #4f46e5; box-shadow: 0 3px 12px #ddd;">
      <h2 style="margin-top: 0; font-size: 18px;">My Projects</h2>
      <ol style="margin: 0; padding-left: 20px; color: #334155;">
        <li style="margin-bottom: 4px;">Registration Page</li>
        <li style="margin-bottom: 4px;">Library Management Page</li>
        <li>Student Profile Page</li>
      </ol>
    </section>

    <!-- Course Registration Card -->
    <section style="background: white; padding: 16px; margin-top: 12px; border-radius: 16px; box-shadow: 0 3px 12px #ddd;">
      <h2 style="margin: 0 0 12px; color: #0f172a; font-size: 20px;">Course Registration</h2>
      <form action="" method="get">
        
        <label for="name" style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 4px;">Full Name</label>
        <input type="text" name="name" id="name" placeholder="Enter Full Name" required style="box-sizing: border-box; width: 100%; padding: 10px; margin-bottom: 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 9px;">

        <label for="email" style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 4px;">Email</label>
        <input type="email" name="email" id="email" placeholder="Enter Email" required style="box-sizing: border-box; width: 100%; padding: 10px; margin-bottom: 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 9px;">

        <label for="course" style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 4px;">Course</label>
        <select name="course" id="course" style="box-sizing: border-box; width: 100%; padding: 10px; margin-bottom: 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 9px;">
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="html">HTML</option>
        </select>

        <p style="margin: 0 0 6px; font-size: 14px; font-weight: bold;">Learning Mode:</p>
        <div style="margin-bottom: 12px; font-size: 14px;">
          <label for="online" style="margin-right: 12px;"><input type="radio" name="mode" id="online" value="online"> Online</label>
          <label for="offline"><input type="radio" name="mode" id="offline" value="offline"> Offline</label>
        </div>

        <label for="comment" style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 4px;">Comments</label>
        <textarea name="comment" id="comment" rows="3" style="box-sizing: border-box; width: 100%; padding: 10px; margin-bottom: 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 9px;"></textarea>

        <p style="margin: 0 0 14px; font-size: 14px;">
          <label for="agree"><input type="checkbox" name="agree" id="agree" required> I agree the terms and conditions</label>
        </p>

        <button type="submit" style="background: #4f46e5; color: white; padding: 10px 18px; border: 0; border-radius: 9px; font-weight: bold; cursor: pointer;">Register</button>
        <button type="reset" style="background: #e2e8f0; color: #334155; padding: 10px 18px; border: 0; border-radius: 9px; font-weight: bold; margin-left: 6px; cursor: pointer;">Reset</button>
      </form>
    </section>

    <!-- Contact Card -->
    <section style="background: white; padding: 16px; margin-top: 12px; border-radius: 16px; box-shadow: 0 3px 12px #ddd;">
      <h2 style="margin: 0 0 10px; font-size: 18px;">Contact</h2>
      <a href="mailto:praveen@example.com" style="display: inline-block; background: #ede9fe; color: #4338ca; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px;">Email Me</a>
    </section>

  </main>
</body>
</html>
